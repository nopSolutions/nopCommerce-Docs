name: Sync Upstream & Auto Translate

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_retranslate:
        description: '強制重新翻譯'
        required: false
        default: 'false'

jobs:
  sync-and-translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add upstream & fetch
        run: |
          git remote add upstream [https://github.com/nopSolutions/nopCommerce-Docs.git](https://github.com/nopSolutions/nopCommerce-Docs.git) || true
          git fetch upstream master
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Upstream
        run: git merge upstream/master --no-edit -X theirs || true

      - name: Run Translator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 檢查專案檔路徑是否存在
          PROJECT_PATH=".github/scripts/translate/translate.csproj"
          if [ ! -f "$PROJECT_PATH" ]; then
            echo "❌ 找不到專案檔於 $PROJECT_PATH"
            exit 1
          fi
          
          dotnet run --project $PROJECT_PATH -c Release -- \
            --source-dir en --target-dir zh-Hant \
            --api-key $GEMINI_API_KEY \
            ${{ github.event.inputs.force_retranslate == 'true' && '--force' || '' }}

      - name: Commit & Push
        run: |
          git add zh-Hant/ en/
          if ! git diff --staged --quiet; then
            git commit -m "🌐 自動翻譯更新: 同步上游並更新繁體中文文件"
            git push origin master
          fi
